<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quran Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f12;
            --panel: #14181d;
            --panel-2: #1a2027;
            --ink: #eef1f4;
            --muted: #8b949e;
            --line: rgba(255, 255, 255, 0.08);
            --accent: #2ca4ab;
            --accent-soft: rgba(44, 164, 171, 0.12);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
        }

        body {
            font-family: Inter, "Noto Sans SC", sans-serif;
            min-height: 100vh;
        }

        .app {
            max-width: 820px;
            margin: 0 auto;
            padding: 0 20px 80px;
        }

        .controls {
            position: sticky;
            top: 0;
            z-index: 10;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--line);
            padding: 16px 0 14px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .brand {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.03em;
        }

        .pills {
            display: flex;
            padding: 3px;
            border-radius: 999px;
            background: var(--panel-2);
        }

        .pills button {
            appearance: none;
            border: 0;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 999px;
            cursor: pointer;
        }

        .pills button.active {
            background: #fff;
            color: #111;
        }

        .surah-row,
        .tools {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            align-items: center;
        }

        .surah-row { margin-bottom: 12px; }

        label { color: var(--muted); font-size: 13px; }

        select {
            font: inherit;
            font-size: 14px;
            color: var(--ink);
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8px 10px;
            max-width: min(100%, 420px);
        }

        audio {
            width: 100%;
            margin: 4px 0 12px;
            color-scheme: dark;
        }

        .speed {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1 1 220px;
            min-width: 200px;
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--accent);
            height: 4px;
        }

        #speed-value {
            min-width: 3.2em;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
            font-size: 13px;
            font-weight: 500;
        }

        .check {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 13px;
            user-select: none;
        }

        .status {
            margin: 10px 0 0;
            font-size: 13px;
            color: var(--muted);
        }

        .status.error { color: #f0b429; }

        .verse {
            padding: 28px 8px 26px;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
        }

        .verse:hover { background: rgba(255, 255, 255, 0.02); }

        .verse.active {
            background: var(--accent-soft);
            border-radius: 16px;
            border-bottom-color: transparent;
        }

        .verse-meta {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 12px;
            letter-spacing: 0.02em;
        }

        .arabic {
            font-family: "Amiri", "Times New Roman", serif;
            font-size: 34px;
            line-height: 2;
            text-align: right;
            direction: rtl;
            margin: 0;
        }

        .transliteration {
            margin: 14px 0 0;
            color: #c5ccd3;
            font-size: 15px;
            line-height: 1.7;
            font-style: italic;
        }

        .chinese {
            font-family: "Noto Sans SC", sans-serif;
            font-size: 17px;
            line-height: 1.35;
            margin: 12px 0 0;
            color: #d7dde3;
        }

        .zh-word {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: top;
            margin: 0 0.35em 0.85em;
            border-radius: 4px;
            max-width: 9.5em;
        }

        .zh-surface {
            text-align: center;
        }

        .zh-en {
            font-family: Inter, sans-serif;
            font-size: 11px;
            line-height: 1.25;
            color: var(--muted);
            text-align: center;
            margin-top: 3px;
        }

        .ar-word {
            border-radius: 4px;
        }

        .has-meaning {
            cursor: help;
        }

        .zh-word.has-meaning .zh-surface {
            border-bottom: 1px dotted rgba(44, 164, 171, 0.4);
        }

        .ar-word.has-meaning:hover,
        .zh-word.has-meaning:hover {
            background: rgba(44, 164, 171, 0.18);
        }

        .arabic .ar-word { margin-inline-start: 0.35em; }
        .arabic .ar-word:first-child { margin-inline-start: 0; }

        ruby { ruby-position: over; }
        rt {
            font-family: Inter, sans-serif;
            font-size: 10px;
            font-style: normal;
            color: var(--muted);
        }

        #meaning-tip {
            position: fixed;
            z-index: 40;
            max-width: min(320px, calc(100vw - 16px));
            padding: 10px 12px;
            border-radius: 12px;
            background: #1c242c;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
            pointer-events: none;
            color: var(--ink);
        }

        #meaning-tip[hidden] { display: none; }

        .tip-word {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .tip-meta {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .tip-en {
            font-size: 14px;
            line-height: 1.45;
            color: #dce3e8;
        }

        .footnotes {
            margin: 10px 0 0;
            font-size: 13px;
            color: var(--muted);
        }

        body.view-arabic .transliteration,
        body.view-arabic .chinese,
        body.view-arabic .footnotes,
        body.view-chinese .arabic,
        body.view-chinese .transliteration,
        body.view-chinese .footnotes {
            display: none;
        }

        @media (max-width: 640px) {
            .arabic { font-size: 28px; }
            .topbar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body class="view-all">
    <div class="app">
        <div class="controls">
            <div class="topbar">
                <h1 class="brand">Quran Player</h1>
                <div class="pills" role="tablist" aria-label="Text view">
                    <button type="button" data-view="all" class="active">All</button>
                    <button type="button" data-view="arabic">Arabic</button>
                    <button type="button" data-view="chinese">Chinese</button>
                </div>
            </div>

            <div class="surah-row">
                <label for="surah">Surah</label>
                <select id="surah"></select>
            </div>

            <audio id="quran-audio" controls></audio>

            <div class="tools">
                <div class="speed">
                    <label for="speed">Speed</label>
                    <input id="speed" type="range" min="0.3" max="2.0" step="0.1" value="1.0">
                    <span id="speed-value">1.0x</span>
                </div>

                <label for="audio-lang">Audio</label>
                <select id="audio-lang">
                    <option value="arabic" selected>Arabic recitation</option>
                    <option value="chinese">Chinese translation</option>
                </select>

                <label class="check">
                    <input type="checkbox" id="repeat-verse"> Repeat verse
                </label>
            </div>

            <p class="status" id="status">Loading verses…</p>
        </div>

        <div id="playlist"></div>
        <div id="meaning-tip" hidden>
            <div class="tip-word"></div>
            <div class="tip-meta"></div>
            <div class="tip-en"></div>
        </div>
    </div>

            [111, "Al-Masad", "المسد"],
            [112, "Al-Ikhlas", "الإخلاص"],

        const audio = document.getElementById("quran-audio");
        const surahSelect = document.getElementById("surah");
        const speedSlider = document.getElementById("speed");
        const speedValue = document.getElementById("speed-value");
        const audioLangSelect = document.getElementById("audio-lang");
        const repeatVerse = document.getElementById("repeat-verse");
        const statusEl = document.getElementById("status");
        const playlist = document.getElementById("playlist");

        let verses = [];
        let currentIndex = 0;
        let cedict = new Map();
        let maxWordLen = 8;
        const tipEl = document.getElementById("meaning-tip");

        const QURAN_GLOSSARY = {
            "安拉": "Allah",
            "真主": "Allah; God",
            "经典": "the Scripture; the Book",
            "降示": "to reveal (scripture)",
            "信士": "believers",
            "信道": "to believe",
            "信道者": "those who believe",
            "不信道": "those who disbelieve",
            "仆人": "servant",
            "穆罕默德": "Muhammad",
            "使者": "messenger",
            "先知": "prophet",
            "乐园": "Paradise",
            "天园": "Paradise",
            "火狱": "Hellfire",
            "后世": "the Hereafter",
            "今世": "this worldly life",
            "偏邪": "crookedness; deviation",
            "崇拜": "to worship",
            "赞颂": "praise",
            "报应": "recompense",
            "复活": "resurrection",
            "审判": "judgment",
            "恶魔": "devil; Satan",
            "精灵": "jinn",
            "启示": "revelation",
            "天经": "the heavenly Book",
            "不义": "injustice",
            "顺从": "to submit; to obey"
        };

        function pad3(n) {
            return String(n).padStart(3, "0");
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function tidyMeaning(text) {
            const parts = String(text)
                .split(";")
                .map((part) => part.replace(/\([^)]{24,}\)/g, "").trim())
                .filter((part) => part && !/urinate|defecate|surname /i.test(part));
            const chosen = [];
            parts.forEach((part) => {
                if (chosen.length >= 2) return;
                if (chosen.join("; ").length > 55) return;
                chosen.push(part);
            });
            return (chosen.join("; ") || String(text)).slice(0, 80);
        }

        function speedRate() {
            return Number.parseFloat(speedSlider.value);
        }

        function applySpeed() {
            const rate = speedRate();
            speedValue.textContent = `${rate.toFixed(1)}x`;
            audio.playbackRate = rate;
        }

        function verseAudioUrl(sura, aya) {
            const key = `${pad3(sura)}${pad3(aya)}.mp3`;
            if (audioLangSelect.value === "chinese") {
                return `https://d.quranenc.com/data/audio/chinese_suliman/${key}`;
            }
            return `https://everyayah.com/data/Alafasy_128kbps/${key}`;
        }

        function pinyinOf(text) {
            const pinyinFn = window.pinyinPro && window.pinyinPro.pinyin;
            if (typeof pinyinFn !== "function") return "";
            return pinyinFn(text, { toneType: "symbol", type: "string", nonZh: "consecutive" });
        }

        function toRuby(text) {
            return Array.from(text).map((ch) => {
                if (!/\p{Script=Han}/u.test(ch)) {
                    return escapeHtml(ch);
                }
                return `<ruby>${escapeHtml(ch)}<rt>${escapeHtml(pinyinOf(ch))}</rt></ruby>`;
            }).join("");
        }

        function segmentChinese(text) {
            const chars = Array.from(text);
            const tokens = [];
            let i = 0;
            while (i < chars.length) {
                if (!/\p{Script=Han}/u.test(chars[i])) {
                    let j = i + 1;
                    while (j < chars.length && !/\p{Script=Han}/u.test(chars[j])) j += 1;
                    tokens.push({ text: chars.slice(i, j).join(""), han: false });
                    i = j;
                    continue;
                }
                let match = chars[i];
                const limit = Math.min(maxWordLen, chars.length - i);
                for (let len = limit; len >= 1; len -= 1) {
                    const slice = chars.slice(i, i + len).join("");
                    if (cedict.has(slice)) {
                        match = slice;
                        break;
                    }
                }
                tokens.push({
                    text: match,
                    han: true,
                    en: tidyMeaning(cedict.get(match) || "")
                });
                i += Array.from(match).length;
            }
            return tokens;
        }

        function renderChinese(text) {
            return segmentChinese(text).map((token) => {
                if (!token.han) return escapeHtml(token.text);
                const inner = toRuby(token.text);
                const english = token.en
                    ? `<span class="zh-en">${escapeHtml(token.en)}</span>`
                    : "";
                const meaningClass = token.en ? " has-meaning" : "";
                const meaningData = token.en
                    ? ` data-word="${escapeHtml(token.text)}" data-en="${escapeHtml(token.en)}" data-tr="${escapeHtml(pinyinOf(token.text))}"`
                    : "";
                return `<span class="zh-word${meaningClass}"${meaningData}><span class="zh-surface">${inner}</span>${english}</span>`;
            }).join("");
        }

        function renderArabic(verse) {
            if (!verse.words || !verse.words.length) {
                return escapeHtml(verse.arabic_text);
            }
            return verse.words.map((word) => {
                if (!word.en) {
                    return `<span class="ar-word">${escapeHtml(word.text)}</span>`;
                }
                return `<span class="ar-word has-meaning" data-word="${escapeHtml(word.text)}" data-en="${escapeHtml(word.en)}" data-tr="${escapeHtml(word.tr)}">${escapeHtml(word.text)}</span>`;
            }).join("");
        }

        function hideMeaningTip() {
            tipEl.hidden = true;
        }

        function showMeaningTip(wordEl) {
            const english = wordEl.dataset.en;
            if (!english) {
                hideMeaningTip();
                return;
            }
            tipEl.querySelector(".tip-word").textContent = wordEl.dataset.word || "";
            tipEl.querySelector(".tip-meta").textContent = wordEl.dataset.tr || "";
            tipEl.querySelector(".tip-en").textContent = english;
            tipEl.hidden = false;
            const rect = wordEl.getBoundingClientRect();
            const tipRect = tipEl.getBoundingClientRect();
            let left = rect.left + (rect.width / 2) - (tipRect.width / 2);
            let top = rect.top - tipRect.height - 10;
            if (top < 8) top = rect.bottom + 10;
            left = Math.max(8, Math.min(left, window.innerWidth - tipRect.width - 8));
            tipEl.style.left = `${left}px`;
            tipEl.style.top = `${top}px`;
        }

        async function loadCedict() {
            const response = await fetch("cedict.min.json");
            if (!response.ok) {
                throw new Error("Could not load Chinese dictionary");
            }
            const data = await response.json();
            cedict = new Map(Object.entries(data));
            Object.entries(QURAN_GLOSSARY).forEach(([word, meaning]) => {
                cedict.set(word, meaning);
            });
            maxWordLen = 0;
            cedict.forEach((_, word) => {
                maxWordLen = Math.max(maxWordLen, Array.from(word).length);
            });
        }

        async function fetchArabicWords(suraNumber) {
            const byAya = {};
            let page = 1;
            for (;;) {
                const response = await fetch(
                    `https://api.quran.com/api/v4/verses/by_chapter/${suraNumber}?language=en&words=true&per_page=50&page=${page}&word_fields=text_uthmani,translation,transliteration`
                );
                if (!response.ok) break;
                const data = await response.json();
                (data.verses || []).forEach((verse) => {
                    byAya[verse.verse_number] = (verse.words || [])
                        .filter((word) => word.char_type_name === "word")
                        .map((word) => ({
                            text: word.text_uthmani || word.text || "",
                            en: (word.translation && word.translation.text) || "",
                            tr: (word.transliteration && word.transliteration.text) || ""
                        }));
                });
                if (!data.pagination || !data.pagination.next_page) break;
                page = data.pagination.next_page;
            }
            return byAya;
        }

        function setStatus(message, isError) {
            statusEl.textContent = message;
            statusEl.classList.toggle("error", Boolean(isError));
        }

        function setView(view) {
            document.body.classList.remove("view-all", "view-arabic", "view-chinese");
            document.body.classList.add(`view-${view}`);
            document.querySelectorAll(".pills button").forEach((button) => {
                button.classList.toggle("active", button.dataset.view === view);
            });
        }

        function highlightVerse() {
            playlist.querySelectorAll(".verse").forEach((el) => {
                el.classList.toggle("active", Number(el.dataset.index) === currentIndex);
            });
            const active = playlist.querySelector(".verse.active");
            if (active) {
                active.scrollIntoView({ behavior: "smooth", block: "center" });
            }
        }

        function loadVerseAudio(index, play) {
            if (!verses[index]) return;
            currentIndex = index;
            const verse = verses[index];
            audio.src = verseAudioUrl(verse.sura, verse.aya);
            applySpeed();
            highlightVerse();
            if (play) {
                audio.play().catch(() => {
                    setStatus("Press play on the audio player to start.", false);
                });
            }
        }

        function renderVerses() {
            playlist.innerHTML = verses.map((verse, index) => {
                const footnotes = verse.footnotes
                    ? `<p class="footnotes">${escapeHtml(verse.footnotes)}</p>`
                    : "";
                const transliteration = verse.transliteration
                    ? `<p class="transliteration">${escapeHtml(verse.transliteration)}</p>`
                    : "";
                return `
                    <div class="verse" data-index="${index}">
                        <div class="verse-meta">${verse.sura}:${verse.aya}</div>
                        <p class="arabic">${renderArabic(verse)}</p>
                        ${transliteration}
                        <p class="chinese">${renderChinese(verse.translation)}</p>
                        ${footnotes}
                    </div>
                `;
            }).join("");
        }

        async function loadSurah(suraNumber, playFirst) {
            hideMeaningTip();
            setStatus("Loading verses…", false);
            playlist.innerHTML = "";
            verses = [];
            audio.pause();
            audio.removeAttribute("src");
            audio.load();

            try {
                const [zhRes, trRes, arabicWords] = await Promise.all([
                    fetch(`https://quranenc.com/api/v1/translation/sura/chinese_suliman/${suraNumber}`),
                    fetch(`https://api.alquran.cloud/v1/surah/${suraNumber}/en.transliteration`),
                    fetchArabicWords(suraNumber).catch(() => ({}))
                ]);
                if (!zhRes.ok) {
                    throw new Error(`QuranEnc returned ${zhRes.status}`);
                }
                const zhData = await zhRes.json();
                let transliterations = [];
                if (trRes.ok) {
                    const trData = await trRes.json();
                    transliterations = (trData.data && trData.data.ayahs) || [];
                }
                verses = (zhData.result || []).map((item, index) => ({
                    sura: Number(item.sura),
                    aya: Number(item.aya),
                    arabic_text: item.arabic_text || "",
                    words: arabicWords[Number(item.aya)] || [],
                    transliteration: (transliterations[index] && transliterations[index].text) || "",
                    translation: item.translation || "",
                    footnotes: item.footnotes || ""
                }));
                if (!verses.length) {
                    throw new Error("No verses returned");
                }
                renderVerses();
                const surah = SURAHS.find((item) => item[0] === Number(suraNumber));
                setStatus(
                    `${surah ? surah[1] : "Surah"} · ${verses.length} verses · hover a word for English`,
                    false
                );
                loadVerseAudio(0, playFirst);
            } catch (error) {
                setStatus(`Could not load verses: ${error.message}`, true);
            }
        }

        SURAHS.forEach(([number, english, arabic]) => {
            const option = document.createElement("option");
            option.value = String(number);
            option.textContent = `${number}. ${english} — ${arabic}`;
            if (number === 18) option.selected = true;
            surahSelect.appendChild(option);
        });

        surahSelect.addEventListener("change", () => {
            loadSurah(surahSelect.value, false);
        });

        speedSlider.addEventListener("input", applySpeed);

        audioLangSelect.addEventListener("change", () => {
            loadVerseAudio(currentIndex, !audio.paused);
        });

        document.querySelector(".pills").addEventListener("click", (event) => {
            const button = event.target.closest("button[data-view]");
            if (button) setView(button.dataset.view);
        });

        audio.addEventListener("loadedmetadata", applySpeed);
        audio.addEventListener("play", applySpeed);

        audio.addEventListener("ended", () => {
            if (repeatVerse.checked) {
                audio.currentTime = 0;
                audio.play();
                return;
            }
            if (currentIndex + 1 < verses.length) {
                loadVerseAudio(currentIndex + 1, true);
            }
        });

        playlist.addEventListener("click", (event) => {
            const verseEl = event.target.closest(".verse");
            if (!verseEl) return;
            loadVerseAudio(Number(verseEl.dataset.index), true);
        });

        playlist.addEventListener("pointerover", (event) => {
            const wordEl = event.target.closest(".has-meaning");
            if (wordEl) showMeaningTip(wordEl);
        });

        playlist.addEventListener("pointerout", (event) => {
            const wordEl = event.target.closest(".has-meaning");
            if (!wordEl) return;
            const next = event.relatedTarget;
            if (next && wordEl.contains(next)) return;
            hideMeaningTip();
        });

        window.addEventListener("scroll", hideMeaningTip, { passive: true });

        applySpeed();
        loadCedict()
            .catch(() => setStatus("Chinese hover dictionary could not load.", true))
            .finally(() => loadSurah(surahSelect.value, false));
    </script>
</body>
</html>
